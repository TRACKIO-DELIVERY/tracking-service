<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastreamento Pedido</title>

    <style>
      #map {
        width: 100%;
        height: 100vh;
      }
    </style>
     </style>
     
      <script src="https://trackio.amisahdev.com.br/track/socket.io/socket.io.js"></script>
      <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAOtpSq1e2acadIZ4D5-VXvXIfAAITSCVw&libraries=maps&v=beta&callback=initApp"
      defer
    ></script>
  </head>
  <body>
    <div id="map"></div>

    <script type="module">
      window.initApp = async () => {
        const socket = io("https://trackio.amisahdev.com.br", {
          path: "/track/socket.io",
          transports: ["websocket"],
        });

        const orderId = window.location.pathname.split("/").pop()

        //-- Salva no localstorage a rota
        
        try {
            const response = await fetch(
                "https://trackio.amisahdev.com.br/track/route-preview", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json', 
                    },
                    body: JSON.stringify({orderId})
                })  
            if (!response.ok) {
                throw new Error(`Http error: ${response.status}`);
            }

            const data = await response.json();
            console.log("DATA", data.coords);
            localStorage.setItem("coords", JSON.stringify(data.coords));
        } catch (error) {
            console.error("Erro ao buscar coordenadas:", error);
            return null;      
        }
        
        // -- Inicia mapa e preview com as coords 
        const coordsStored =  localStorage.getItem('coords')
        const coords = JSON.parse(coordsStored)
   
        if (!coords){
          console.log('coords invalidas')
          return
        }

        const map = new google.maps.Map(document.getElementById('map'), {
          center: { lat: coords.origin.lat, lng: coords.origin.lng },
          zoom: 18,
        })


        //preview
        
        const directionsService = new google.maps.DirectionsService();
        const directionsRenderer = new google.maps.DirectionsRenderer({
          suppressMarkers: true,
          polylineOptions: {
            strokeColor: 'blue',
          },
        });

        directionsRenderer.setMap(map);

        directionsService.route(
          {
            origin: coords.origin,
            destination: coords.destination,
            travelMode: google.maps.TravelMode.DRIVING,
          },
          (result, status) => {
            if (status === google.maps.DirectionsStatus.OK) {
              directionsRenderer.setDirections(result);

              // Marcador de origem
              new google.maps.Marker({
                position: coords.origin,
                map: map,
                label: 'A',
                title: 'Origem',
              });

              // Marcador de destino
              new google.maps.Marker({
                position: coords.destination,
                map: map,
                label: 'B',
                title: 'Destino',
              });
            } else {
              console.error('Erro ao calcular rota:', status);
            }
          },
        );

        // -- entra na sala do pedido
    
        socket.emit('join_order', orderId)
        
        // --  adiciona o marcador sempre que é enviada a nova localização
        let deliverMarker = null;
        socket.on("location_update", (coords) => {
          const { latitude, longitude } = coords;

          const position = { lat: latitude, lng: longitude };

          var newCenter = new google.maps.LatLng(latitude, longitude);
          map.panTo(newCenter)

          if (!deliverMarker) {
            deliverMarker = new google.maps.Marker({
              position,
              map,
              title: 'Entregador',
              icon: {
                url: '/img/deliverPerson.png',
                scaledSize: new google.maps.Size(40, 40),
              },
            });
          } else {
        
            deliverMarker.setPosition(position);
          }
      });
        
      };
    </script>
  </body>
</html>
