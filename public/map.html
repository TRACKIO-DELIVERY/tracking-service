<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastreamento Pedido</title>

    <style>
      #map {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
      window.initApp = async () => {
        const { initMap } = await import('/js/mapSetup.js');
        const { showRoutePreview } = await import('/js/routePreview.js');
        const { startMockTrajectory } = await import('/js/mockTrajectory.js');

        const map = initMap(-6.146837279661337, -38.20538841712638);

        showRoutePreview(map, {
          origem: { lat: -6.146837279661337, lng: -38.20538841712638 },
          destino: { lat: -6.145327875209893, lng: -38.20398830396341 },
        });

        startMockTrajectory(map, 1);
      };
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=KEY&libraries=maps&v=beta&callback=initApp"
      defer
    ></script>
  </body>
</html>
