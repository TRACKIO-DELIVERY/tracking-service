<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastreamento Pedido</title>

    <style>
      #map {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
      window.initApp = async () => {
        const socket = io("http://localhost:3000");

        const { initMap } = await import('/js/mapSetup.js');
        const { showRoutePreview } = await import('/js/routePreview.js');
        const { startMockTrajectory } = await import('/js/mockTrajectory.js');

        console.log(window.location.pathname.split("/").pop())
        const map = initMap(-6.146837279661337, -38.20538841712638);
        
        const orderId = window.location.pathname.split("/").pop()
        socket.emit('join_order', {orderId})
        socket.on("route_ready", (data) => {
          console.log("Rota liberada para visualização:", data);
        });
        let deliverMarker = null;
      socket.on("location_update", (coords) => {
        const { latitude, longitude } = coords;

        const position = { lat: latitude, lng: longitude };

        var newCenter = new google.maps.LatLng(latitude, longitude);
        map.panTo(newCenter)

        if (!deliverMarker) {
          deliverMarker = new google.maps.Marker({
            position,
            map,
            title: 'Entregador',
            icon: {
              url: '/img/deliverPerson.png',
              scaledSize: new google.maps.Size(40, 40),
            },
          });
        } else {
          //att a posição do marcador
          deliverMarker.setPosition(position);
        }
      });
        
      };
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=KEY&libraries=maps&v=beta&callback=initApp"
      defer
    ></script>
  </body>
</html>
